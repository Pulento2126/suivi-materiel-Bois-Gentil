<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi Matériel - Version Complète (Mise à jour)</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #3498db;
            --accent: #1abc9c;
            --danger: #e74c3c;
            --bg-color: #ecf0f1;
            --card-bg: #ffffff;
            --text-main: #34495e;
            --text-muted: #7f8c8d;
            --border-radius: 12px;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            color: var(--primary);
            font-size: 2em;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* --- Panneau de contrôle et Filtres --- */
        .controls-container {
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .top-controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .quick-filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: white;
            border: 1px solid #bdc3c7;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.95em;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            color: var(--text-main);
        }

        .filter-btn:hover, .filter-btn.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .filter-select {
            padding: 10px 15px;
            border: 1px solid #bdc3c7;
            border-radius: 20px;
            font-size: 0.95em;
            outline: none;
            background: white;
            color: var(--text-main);
            cursor: pointer;
        }

        .search-bar {
            flex-grow: 1;
            max-width: 300px;
            padding: 10px 15px;
            border: 1px solid #bdc3c7;
            border-radius: 20px;
            font-size: 1em;
            outline: none;
        }
        .search-bar:focus, .filter-select:focus { border-color: var(--secondary); }

        .btn-add-new {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s;
        }
        .btn-add-new:hover { background-color: #16a085; }

        .stats {
            font-weight: 600;
            color: var(--primary);
            display: flex;
            gap: 20px;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }
        .stats-badge {
            background: #e8f8f5;
            color: var(--accent);
            padding: 5px 12px;
            border-radius: 15px;
        }

        /* --- Grille de Cartes --- */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease;
        }
        .card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.12); }

        .card-status-bar { height: 6px; background-color: #f39c12; }
        .card-status-bar.done { background-color: var(--accent); }

        .card-header {
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .resident-info { display: flex; align-items: center; gap: 12px; }
        .avatar-icon { font-size: 2.5em; color: #bdc3c7; }
        .resident-name { font-size: 1.2em; font-weight: bold; color: var(--primary); margin: 0; }
        .resident-room {
            font-size: 0.85em; color: var(--text-muted); background: #f1f2f6;
            padding: 2px 8px; border-radius: 10px; display: inline-block; margin-top: 4px;
        }
        
        .equipment-visual {
            width: 50px; height: 50px;
            display: flex; justify-content: center; align-items: center;
        }
        .equipment-icon { font-size: 2em; color: var(--secondary); opacity: 0.8; }
        .equipment-photo { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; border: 1px solid #eee;}

        .card-body { padding: 15px 20px; flex-grow: 1; font-size: 0.95em; }
        .data-row { display: flex; margin-bottom: 8px; align-items: baseline; }
        .data-label { font-weight: 600; color: var(--text-muted); width: 110px; flex-shrink: 0; }
        .data-value { color: var(--text-main); font-weight: 500; }
        .comments-box {
            margin-top: 15px; padding: 10px; background: #f9fbfd;
            border-left: 3px solid var(--secondary); font-size: 0.9em; font-style: italic; color: var(--text-muted);
        }

        .card-actions {
            padding: 15px 20px; border-top: 1px solid #eee; display: flex; gap: 10px; flex-direction: column;
        }
        .btn-group-horizontal { display: flex; gap: 10px; }
        .btn {
            border: none; padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px; flex-grow: 1;
        }
        .btn-validate { background-color: var(--secondary); color: white; }
        .btn-validate.is-done { background-color: #95a5a6; }
        .btn-edit { background-color: #f1f2f6; color: var(--text-main); }
        .btn-save { background-color: var(--accent); color: white; }
        .btn-cancel { background-color: #e74c3c; color: white; }
        .maintenance-date { text-align: center; font-size: 0.8em; color: var(--text-muted); margin-top: 5px; }

        /* Édition & Modale */
        .edit-input {
            width: 100%; padding: 8px; border: 1px solid #bdc3c7; border-radius: 6px; box-sizing: border-box;
            font-family: inherit; font-size: 0.95em;
        }
        .edit-label { display: block; font-size: 0.85em; font-weight: bold; color: var(--primary); margin-bottom: 4px; }
        .edit-row { margin-bottom: 12px; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: white; padding: 25px; border-radius: var(--border-radius); width: 90%;
            max-width: 500px; max-height: 90vh; overflow-y: auto;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px;}
        .close-btn { background: none; border: none; font-size: 1.5em; cursor: pointer; }

    </style>
</head>

    <div class="header">
        <h1><i class="fas fa-wheelchair"></i> Gestion du Matériel Auxiliaire</h1>
    </div>

    <div class="controls-container">
        <div class="top-controls">
            <div class="quick-filters" id="filterButtons">
                <button class="filter-btn active" onclick="filterByType('all')"><i class="fas fa-layer-group"></i> Tout voir</button>
                <button class="filter-btn" onclick="filterByType('chaise')"><i class="fas fa-wheelchair"></i> Chaises</button>
                <button class="filter-btn" onclick="filterByType('rollator')"><i class="fas fa-walking"></i> Rollators</button>
                <button class="filter-btn" onclick="filterByType('tintébin')"><i class="fas fa-bed-pulse"></i> Tintébins</button>
            </div>
            
            <select id="filterEtage" class="filter-select" onchange="renderCards()">
                <option value="all">Tous les étages</option>
                </select>

            <input type="text" id="searchBar" class="search-bar" placeholder="Recherche texte (Nom, Code...)" oninput="renderCards()">
            
            <button class="btn-add-new" onclick="openModal()"><i class="fas fa-plus"></i> Créer une fiche</button>
        </div>

        <div class="stats">
            <div>Affichés: <span id="stat-total">0</span></div>
            <div class="stats-badge"><i class="fas fa-check-circle"></i> Entretiens validés: <span id="stat-done">0</span></div>
        </div>
    </div>

    <div class="cards-grid" id="cardsContainer"></div>

    <div class="modal-overlay" id="addModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 style="margin:0; color:#2c3e50;"><i class="fas fa-box-open"></i> Ajouter un équipement</h2>
                <button class="close-btn" onclick="closeModal()"><i class="fas fa-times"></i></button>
            </div>
            
            <div class="edit-row">
                <label class="edit-label">Nom du Résidant (ou "Réserve")</label>
                <input type="text" id="new-nom" class="edit-input" placeholder="Ex: M. Dupont">
            </div>
            <div class="edit-row" style="display:flex; gap:10px;">
                <div style="flex:1;">
                    <label class="edit-label">Étage / Local</label>
                    <input type="text" id="new-etage" class="edit-input" placeholder="Ex: 2°">
                </div>
                <div style="flex:1;">
                    <label class="edit-label">Sexe</label>
                    <input type="text" id="new-sexe" class="edit-input" placeholder="M / Mme / -">
                </div>
            </div>
            <div class="edit-row">
                <label class="edit-label">Moyen Auxiliaire (Type)</label>
                <select id="new-moyen" class="edit-input">
                    <option value="Chaise roulante">Chaise roulante</option>
                    <option value="Rollator">Rollator</option>
                    <option value="Tintébin">Tintébin</option>
                    <option value="Autre">Autre</option>
                </select>
            </div>
            <div class="edit-row" style="display:flex; gap:10px;">
                <div style="flex:1;">
                    <label class="edit-label">Code d'inventaire</label>
                    <input type="text" id="new-code" class="edit-input" placeholder="Ex: 42">
                </div>
                <div style="flex:1;">
                    <label class="edit-label">Modèle / Couleur</label>
                    <input type="text" id="new-modele" class="edit-input" placeholder="Ex: Invacare bleu">
                </div>
            </div>
            <div class="edit-row">
                <label class="edit-label">Provenance</label>
                <input type="text" id="new-prov" class="edit-input" placeholder="Ex: EMS (achat)">
            </div>
            <div class="edit-row">
                <label class="edit-label">Commentaires</label>
                <textarea id="new-comm" class="edit-input" rows="3" placeholder="État du matériel..."></textarea>
            </div>
            <div class="edit-row" style="background:#f1f2f6; padding:10px; border-radius:8px;">
                <label class="edit-label"><i class="fas fa-camera"></i> Ajouter une photo</label>
                <input type="file" accept="image/*" class="edit-input" onchange="handlePhotoUpload(this, 'new')">
                <input type="hidden" id="new-photo-data" value="">
                <img id="new-photo-preview" src="" style="display:none; max-width: 100px; margin-top: 10px; border-radius: 8px;">
            </div>
            
            <div class="btn-group-horizontal" style="margin-top: 20px;">
                <button class="btn btn-save" onclick="saveNewItem()"><i class="fas fa-plus-circle"></i> Enregistrer</button>
                <button class="btn btn-cancel" onclick="closeModal()">Annuler</button>
            </div>
        </div>
    </div>

            return date.toISOString().slice(0, 16);

        // --- Utilitaire Image (Compression) ---
        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 300; 
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL("image/jpeg", 0.7)); 
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

                                </div>
                            </div>
                            <div class="equipment-visual">${visualHTML}</div>
                        </div>
                        <div class="card-body">
                            <div class="data-row"><span class="data-label"><i class="fas fa-tag"></i> Type:</span><span class="data-value">${item.moyen || '-'}</span></div>
                            <div class="data-row"><span class="data-label"><i class="fas fa-barcode"></i> Code:</span><span class="data-value">${item.code || '-'}</span></div>
                            <div class="data-row"><span class="data-label"><i class="fas fa-sliders-h"></i> Modèle:</span><span class="data-value">${item.modele || '-'}</span></div>
                            <div class="data-row"><span class="data-label"><i class="fas fa-truck-loading"></i> Source:</span><span class="data-value">${item.provenance || '-'}</span></div>
                            ${item.commentaires && item.commentaires !== "-" ? `<div class="comments-box">${item.commentaires}</div>` : ''}
                        </div>
                        <div class="card-actions">
                            <div class="btn-group-horizontal">
                                <button class="btn btn-validate ${btnValidateClass}" onclick="markMaintenance(${item.id})">
                                    <i class="fas fa-bolt"></i> ${btnValidateText}
                                </button>
                                <button class="btn btn-edit" onclick="startEdit(${item.id})"><i class="fas fa-pencil-alt"></i> Éditer</button>
                            </div>
                            ${statusText}
                        </div>
                    `;
                }

                const cardElement = document.createElement('div');
                cardElement.className = 'card';
                cardElement.innerHTML = cardContentHTML;
                container.appendChild(cardElement);
            });

            document.getElementById('stat-total').innerText = filteredData.length;
            document.getElementById('stat-done').innerText = filteredData.filter(i => i.entretienDate).length;
        }

        window.startEdit = function(id) { editingId = id; renderCards(); }
        window.cancelEdit = function() { editingId = null; renderCards(); }
        window.saveCard = function(id) {
            const index = inventory.findIndex(item => item.id === id);
            if(index !== -1) {
                inventory[index].nom = document.getElementById(`edit-nom-${id}`).value;
                inventory[index].etage = document.getElementById(`edit-etage-${id}`).value;
                inventory[index].moyen = document.getElementById(`edit-moyen-${id}`).value;
                inventory[index].code = document.getElementById(`edit-code-${id}`).value;
                inventory[index].modele = document.getElementById(`edit-modele-${id}`).value;
                inventory[index].provenance = document.getElementById(`edit-prov-${id}`).value;
                inventory[index].commentaires = document.getElementById(`edit-comm-${id}`).value;
                inventory[index].photo = document.getElementById(`edit-photo-data-${id}`).value || null;
                
                const newDate = document.getElementById(`edit-entretien-${id}`).value;
                inventory[index].entretienDate = newDate ? new Date(newDate).toISOString() : null;

                localStorage.setItem('koderEditableCardsV4_UpdatedList', JSON.stringify(inventory));
                editingId = null;
                populateFloorFilter(); 
                renderCards();
            }
        }

        window.markMaintenance = function(id) {
            const index = inventory.findIndex(item => item.id === id);
            if(index !== -1) {
                inventory[index].entretienDate = new Date().toISOString();
                localStorage.setItem('koderEditableCardsV4_UpdatedList', JSON.stringify(inventory));
                renderCards();
            }
        }

        document.getElementById('addModal').addEventListener('click', function(e) { if(e.target === this) closeModal(); });

        populateFloorFilter();
        renderCards();
    </script>
</body>
</html>
